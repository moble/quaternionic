name: tests

on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  # This package changes rarely, but its dependencies do not.  Without
  # this, CI only runs when something is pushed, so breakage
  # introduced by a new numpy/numba release goes unnoticed until a
  # user reports it.
  schedule:
    - cron: "37 6 5 * *"  # 06:37 UTC on the 5th of each month
  workflow_dispatch:

concurrency:
  group: test-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:

  build:
    name: Python ${{ matrix.python-version }} on ${{ startsWith(matrix.os, 'macos-') && 'macOS' || startsWith(matrix.os, 'windows-') && 'Windows' || 'Linux' }}

    runs-on: ${{ matrix.os }}

    if: >-
        !contains(github.event.head_commit.message, '[skip ci]')
        && !contains(github.event.head_commit.message, '[skip tests]')

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The floor from pyproject.toml, and the newest release.  The `newest`
        # flag is attached to the latter, so that the version appears once.
        python-version: ["3.10", "3.14"]
        include:
          - python-version: "3.14"
            newest: true

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Hatch
        run: pip install --upgrade hatch

      - name: Run tests
        if: "! matrix.newest"
        run: hatch run test

      - name: Run tests, treating DeprecationWarnings as errors
        if: matrix.newest
        run: hatch run test-strict

      - name: Upload coverage
        if: "matrix.newest && matrix.os == 'ubuntu-latest'"
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}


  release:
    name: Create release and send to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: >-
        github.event_name == 'push'
        && github.ref == 'refs/heads/main'
        && !contains(github.event.head_commit.message, '[no release]')
        && (success() || contains(github.event.head_commit.message, '[skip tests]'))

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Hatch
        run: pip install --upgrade hatch

      - name: Bump version
        shell: bash
        env:
          github_event_head_commit_message: ${{ github.event.head_commit.message }}
        run: |
          export version_bump_rule=$(python .github/scripts/parse_bump_rule.py)
          echo "version_bump_rule: '${version_bump_rule}'"
          hatch version "${version_bump_rule}"
          export new_version=$(TERM="unknown" hatch version)
          echo "new_version: '${new_version}'"
          echo "new_version=${new_version}" >> $GITHUB_ENV  # Save env variable for later steps

      - name: Update CITATION.cff
        shell: bash
        env:
          timestamp: ${{ github.event.head_commit.timestamp }}
        run: |
          new_date=${timestamp:0:10}
          sed -i -- "s/^version:.*/version: ${new_version}/" CITATION.cff
          sed -i -- "s/^date-released:.*/date-released: ${new_date}/" CITATION.cff
          echo "Updated CITATION.cff with version ${new_version} and date ${new_date}"

      - name: Tag and push new version
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add CITATION.cff quaternionic/__version__.py
          git commit -m "Bump version to v${new_version}"
          git tag -a "v${new_version}" -m "Version ${new_version}"
          git status
          git push --follow-tags  # Will not trigger new workflow because it uses GITHUB_TOKEN

      - name: Create release
        if: "!contains(github.event.head_commit.message, '[no release]')"
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.new_version }}
          name: Release v${{ env.new_version }}
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI
        if: "!contains(github.event.head_commit.message, '[no pypi]')"
        env:
          # 1) Get key from https://pypi.org/manage/account/token/
          # 2) Copy it to Github > repo > Settings > Secrets
          HATCH_INDEX_USER: __token__
          HATCH_INDEX_AUTH: ${{ secrets.PYPI_TOKEN }}
        shell: bash
        run: |
          hatch build
          hatch publish
